# 认证与权限插件。发布时单独成库；开发期由插件目录的 local 指向本目录。
_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .baseline/plugins/admin.yml
_envops:
  keep_trailing_newline: true

# 由 scripts/plugin.py 传入。保留默认值，这样 --defaults 不会交互提问。
# 不能写 when: false，否则 Copier 不把答案记入答案文件，升级时会丢失迁移版本。
project_code:
  type: str
  default: ""

project_name:
  type: str
  default: ""

package_root:
  type: str
  default: ""

package_name:
  type: str
  default: ""

package_path:
  type: str
  default: ""

dialects:
  type: str
  default: postgresql

migration_version:
  type: str
  default: "000000000000"

migration_version_2:
  type: str
  default: "000000000001"

initial_admin_username:
  type: str
  default: admin
  help: 初始管理员用户名。初始密码是 Admin@123，首次登录后应立即修改。
  validator: "{% if not (initial_admin_username | regex_search('^[a-z][a-z0-9]{2,31}$')) %}用户名需为 3 到 32 位小写字母或数字，并以字母开头{% endif %}"

jwt_access_ttl:
  type: str
  default: PT2H
  help: 访问令牌有效期，ISO-8601 时长，例如 PT2H。

data_scope_enabled:
  type: bool
  default: true
  help: 是否按角色的数据范围过滤用户和部门。关闭后登录用户可以查看全部。
